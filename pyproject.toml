[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oceanembed-nio"
version = "0.9.1"
description = "Reproducible subsurface temperature reconstruction research workspace"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "xarray>=2024.1", "h5netcdf>=1.3", "h5py>=3.10", "PyYAML>=6", "fastapi>=0.115,<1", "uvicorn>=0.30", "pydantic>=2,<3", "matplotlib>=3.8", "gsw>=3.6"]

[project.optional-dependencies]
train = ["torch>=2.4,<3"]
dev = ["pytest>=8", "httpx>=0.27"]
download = ["copernicusmarine>=2,<3", "earthaccess>=0.14"]

[project.scripts]
oceanembed = "oceanembed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
